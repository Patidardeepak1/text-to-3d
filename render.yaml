services:
  - type: web
    name: 3dforge-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: tripo
      - key: TRIPO_MODEL
        value: v3.1-20260211
      - key: CORS_ORIGIN
        sync: false
      - key: TRIPO_API_KEY
        sync: false
